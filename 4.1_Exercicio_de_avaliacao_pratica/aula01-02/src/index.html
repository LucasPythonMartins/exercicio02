<!--Comentário: ctrl + k-->

<!doctype html>
<html lang="en">
<!-- Head é a tag de cabeça do HTML -->
<head>
  <!-- Faz a configuração do idioma com acentos na pagina HTML -->
  <!-- meta é a tag que define metadados da página -->
  <meta charset="utf-8">
  <title>Aula0102</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- A tag link é mais usada para instalação de fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<!-- Body é a tag que define o corpo do HTML. Onde fica o corpo da aplicação ou da página em HTML -->
<body>
  <!--A tag app-root é a tag pai, ou mãe do Angular. Ou seja é a primeira tag do projeto.-->
  <app-root></app-root>
</body>
</html>
